<!doctype html>
<html lang="zh-CN" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light only" />
    <title>方德演示</title>
    <style>
      /* Avoid dark FOUC before Vue theme init (official default is system → OS dark). */
      html,
      body {
        background: #ffffff;
        color-scheme: light;
      }
    </style>
    <!-- Official neo-ppt assets (local mirror) -->
    <script type="module" crossorigin src="./neo-ppt/assets/polyfills-CXLN5T9E.js"></script>
    <script>
      (function () {
        // Official app defaults theme to "system" and may flip to dark on mount.
        // Lock light mode before the Vue bundle runs.
        try {
          localStorage.setItem("CUSTOM_THEME", JSON.stringify("light"));
        } catch (_) {}
        window.INJECT_ENV = Object.assign({}, window.INJECT_ENV, { theme: "light" });
        document.documentElement.classList.remove("dark");
        document.documentElement.classList.add("light");
        // Completely offline: block cloud APIs early
        const blocked = [
          /\/apiv2\//,
          /www\.kimi\.com/,
          /kimi\.ai/,
          /slides\.kimi\./,
          /gator\.volces\.com/,
          /volces\.com/,
          /byteimg\.com\/obj\/.*log/,
          /\/list$/,
          /accounts\.google\.com/,
          /googleapis\.com/,
          /docs\.google\.com/,
        ];
        const nativeFetch = window.fetch.bind(window);
        window.fetch = function (input, init) {
          const url = typeof input === "string" ? input : input && input.url;
          if (url && blocked.some((re) => re.test(String(url)))) {
            return Promise.resolve(
              new Response(
                JSON.stringify({
                  signature: "offline-bypass",
                  algorithm: "Ed25519",
                  offline: true,
                }),
                {
                  status: 200,
                  headers: { "Content-Type": "application/json" },
                },
              ),
            );
          }
          return nativeFetch(input, init);
        };
        const XO = XMLHttpRequest.prototype.open;
        XMLHttpRequest.prototype.open = function (method, url) {
          this.__ndUrl = url;
          return XO.apply(this, arguments);
        };
        const XS = XMLHttpRequest.prototype.send;
        XMLHttpRequest.prototype.send = function () {
          if (this.__ndUrl && blocked.some((re) => re.test(String(this.__ndUrl)))) {
            Object.defineProperty(this, "status", { value: 200 });
            Object.defineProperty(this, "responseText", { value: '{"offline":true}' });
            this.onload && this.onload();
            return;
          }
          return XS.apply(this, arguments);
        };

        // Keep upstream implementation details out of the employee-facing UI.
        // This only rewrites rendered text and accessibility labels; protocol
        // names, URLs, class names, and export metadata remain untouched.
        const brandText = (value) =>
          String(value)
            .replaceAll("Moonshot", "方德")
            .replaceAll("Kimi", "方德")
            .replaceAll("kimi", "方德");
        const sanitizeVisibleBranding = (root) => {
          if (!root) return;
          const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
          const textNodes = [];
          while (walker.nextNode()) textNodes.push(walker.currentNode);
          for (const node of textNodes) {
            if (node.parentElement?.closest("script,style")) continue;
            const next = brandText(node.nodeValue || "");
            if (next !== node.nodeValue) node.nodeValue = next;
          }
          for (const element of root.querySelectorAll?.(
            "[title], [aria-label], [placeholder], [alt]",
          ) || []) {
            for (const attribute of ["title", "aria-label", "placeholder", "alt"]) {
              if (!element.hasAttribute(attribute)) continue;
              const value = element.getAttribute(attribute) || "";
              const next = brandText(value);
              if (next !== value) element.setAttribute(attribute, next);
            }
          }
        };
        const brandingObserver = new MutationObserver((records) => {
          for (const record of records) {
            if (record.type === "characterData")
              sanitizeVisibleBranding(record.target.parentElement);
            for (const node of record.addedNodes) {
              if (node.nodeType === Node.ELEMENT_NODE) sanitizeVisibleBranding(node);
              else if (node.nodeType === Node.TEXT_NODE)
                sanitizeVisibleBranding(node.parentElement);
            }
          }
        });
        brandingObserver.observe(document.documentElement, {
          subtree: true,
          childList: true,
          characterData: true,
        });
        addEventListener("DOMContentLoaded", () => sanitizeVisibleBranding(document.body), {
          once: true,
        });
      })();
    </script>
