name: FD Desktop Context

on:
  pull_request:
    paths:
      - "apps/server/src/fd-codex/**"
      - "apps/server/src/provider/**"
      - "apps/server/src/orchestration/**"
      - "apps/web/src/components/ChatView.tsx"
      - "apps/web/src/components/chat/**"
      - ".github/workflows/fd-context-check.yml"
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: Existing release run to verify on macOS
        type: string
      version:
        description: Release version
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: fd-context-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  context:
    if: ${{ !inputs.artifact_run_id }}
    name: Context Regression
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Add workspace binaries
        run: echo "$GITHUB_WORKSPACE/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Typecheck local server and renderer
        run: |
          vp run --filter ./apps/server typecheck
          vp run --filter ./apps/web typecheck
      - name: Context regressions
        run: >-
          vp test run
          apps/server/src/fd-codex/FdContextBinding.test.ts
          apps/server/src/provider/Layers/CodexSessionRuntime.test.ts
          apps/server/src/provider/Layers/CodexAdapter.test.ts
          apps/server/src/provider/Layers/FdDeepSeekAdapter.test.ts
          apps/server/src/provider/Layers/ProviderService.test.ts
          apps/server/src/provider/Layers/ProviderSessionReaper.test.ts
          apps/server/src/orchestration/Layers/ProviderCommandReactor.test.ts
          apps/server/src/orchestration/Layers/ProviderRuntimeIngestion.test.ts
          apps/server/src/orchestration/Layers/ProjectionPipeline.test.ts
          apps/server/src/orchestration/Layers/CheckpointReactor.test.ts
          apps/web/src/lib/contextWindow.test.ts
      - name: Build desktop
        run: vp run build:desktop
  verify-mac-release:
    if: ${{ inputs.artifact_run_id }}
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.artifact_run_id }}
          name: fd-desktop-release-${{ inputs.version }}
          path: assets
      - name: Verify immutable artifact hashes and macOS structures
        env:
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          cd assets
          shasum -a 256 -c SHA256SUMS
          mkdir unpacked mount
          ditto -x -k "FD-Enterprise-AI-$VERSION-mac-arm64.zip" unpacked
          hdiutil attach -readonly -nobrowse -mountpoint "$PWD/mount" "FD-Enterprise-AI-$VERSION-mac-arm64.dmg"
          trap 'hdiutil detach "$PWD/mount"' EXIT
          for app in "unpacked/Fangde AI.app" "mount/Fangde AI.app"; do
            codesign --verify --deep --strict --verbose=2 "$app"
            test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")" = com.fdsure.enterprise-ai
            test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")" = "$VERSION"
            exe=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")
            test "$(lipo -archs "$app/Contents/MacOS/$exe")" = arm64
            shasum -a 256 "$app/Contents/MacOS/$exe"
          done
          cmp "unpacked/Fangde AI.app/Contents/MacOS/$exe" "mount/Fangde AI.app/Contents/MacOS/$exe"
          echo "Verified release $VERSION: hashes, signatures, identifiers, versions, arm64, DMG/ZIP equivalence"
