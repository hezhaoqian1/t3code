name: FD Desktop Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version, for example 0.2.0
        required: true
        type: string

permissions:
  contents: read

env:
  TRUSTED_SIGNING_MODULE_VERSION: 0.5.0

jobs:
  preflight:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - id: version
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Production releases must run from refs/heads/main, got $GITHUB_REF" >&2
            exit 1
          fi
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release version: $RELEASE_VERSION" >&2
            exit 1
          fi
          echo "value=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"

  build:
    needs: preflight
    environment: production-signing
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: mac
            arch: arm64
            runner: macos-14
            rust_target: aarch64-apple-darwin
          - platform: mac
            arch: x64
            runner: macos-14
            rust_target: x86_64-apple-darwin
          - platform: win
            arch: x64
            runner: windows-2025
            rust_target: x86_64-pc-windows-msvc
          - platform: win
            arch: arm64
            runner: windows-2025
            rust_target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.16.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Require Apple signing configuration
        if: matrix.platform == 'mac'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          required=(CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER)
          missing=()
          for name in "${required[@]}"; do
            [[ -n "${!name:-}" ]] || missing+=("$name")
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required production signing secrets: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Require Azure signing configuration
        if: matrix.platform == 'win'
        shell: bash
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME }}
          AZURE_TRUSTED_SIGNING_PUBLISHER_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_PUBLISHER_NAME }}
        run: |
          set -euo pipefail
          required=(
            AZURE_TENANT_ID AZURE_CLIENT_ID AZURE_CLIENT_SECRET
            AZURE_TRUSTED_SIGNING_ENDPOINT AZURE_TRUSTED_SIGNING_ACCOUNT_NAME
            AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME
            AZURE_TRUSTED_SIGNING_PUBLISHER_NAME
          )
          missing=()
          for name in "${required[@]}"; do
            [[ -n "${!name:-}" ]] || missing+=("$name")
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required production signing secrets: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Align release versions
        run: node scripts/update-release-package-versions.ts "${{ needs.preflight.outputs.version }}"

      - name: Prepare Apple notarization key
        if: matrix.platform == 'mac'
        shell: bash
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          set -euo pipefail
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY_CONTENT" > "$key_path"
          echo "APPLE_API_KEY=$key_path" >> "$GITHUB_ENV"

      - name: Prepare pinned Azure Trusted Signing
        if: matrix.platform == 'win'
        shell: pwsh
        run: ./scripts/prepare-trusted-signing.ps1

      - name: Build signed macOS desktop package
        if: matrix.platform == 'mac'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          node scripts/build-desktop-artifact.ts \
            --platform mac \
            --target dmg \
            --arch "${{ matrix.arch }}" \
            --build-version "${{ needs.preflight.outputs.version }}" \
            --signed

      - name: Build signed Windows desktop package
        if: matrix.platform == 'win'
        shell: bash
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME }}
          AZURE_TRUSTED_SIGNING_PUBLISHER_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_PUBLISHER_NAME }}
        run: |
          set -euo pipefail
          node scripts/build-desktop-artifact.ts \
            --platform win \
            --target nsis \
            --arch "${{ matrix.arch }}" \
            --build-version "${{ needs.preflight.outputs.version }}" \
            --signed

      - name: Verify signed and notarized macOS package
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          set -euo pipefail
          dmg="release/FD-Enterprise-AI-${{ needs.preflight.outputs.version }}-mac-${{ matrix.arch }}.dmg"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg"
          xcrun stapler validate "$dmg"
          mount_dir="$RUNNER_TEMP/fd-app-${{ matrix.arch }}"
          mkdir -p "$mount_dir"
          device=$(hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mount_dir" | tail -1 | awk '{print $1}')
          trap 'hdiutil detach "$device"' EXIT
          app=$(find "$mount_dir" -maxdepth 1 -name '*.app' -print -quit)
          [[ -n "$app" ]]
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose=2 "$app"
          xcrun stapler validate "$app"

      - name: Verify Windows Authenticode publisher
        if: matrix.platform == 'win'
        shell: pwsh
        env:
          EXPECTED_PUBLISHER: ${{ secrets.AZURE_TRUSTED_SIGNING_PUBLISHER_NAME }}
        run: |
          $installer = "release/FD-Enterprise-AI-${{ needs.preflight.outputs.version }}-win-${{ matrix.arch }}.exe"
          $signature = Get-AuthenticodeSignature -FilePath $installer
          if ($signature.Status -ne "Valid") { throw "Invalid Authenticode signature: $($signature.Status)" }
          $actualPublisher = $signature.SignerCertificate.Subject.Trim()
          $expectedPublisher = $env:EXPECTED_PUBLISHER.Trim()
          if (-not [string]::Equals($actualPublisher, $expectedPublisher, [StringComparison]::OrdinalIgnoreCase)) {
            throw "Unexpected Authenticode publisher: $($signature.SignerCertificate.Subject)"
          }

      - name: Collect updater assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir release-publish
          cp release/* release-publish/
          find release-publish -type f \
            ! -name '*.dmg' ! -name '*.zip' ! -name '*.exe' ! -name '*.blockmap' \
            ! -name 'latest*.yml' -delete
          if [[ "${{ matrix.platform }}" == mac ]]; then
            rm -f release-publish/*.blockmap
          fi
          if [[ "${{ matrix.platform }}" == mac && "${{ matrix.arch }}" == x64 ]]; then
            mv release-publish/latest-mac.yml release-publish/latest-mac-x64.yml
          fi
          if [[ "${{ matrix.platform }}" == win ]]; then
            mv release-publish/latest.yml "release-publish/latest-win-${{ matrix.arch }}.yml"
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fd-desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: release-publish/*
          if-no-files-found: error
          retention-days: 7

  bundle:
    needs: [preflight, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.16.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Install script dependencies
        run: pnpm install --frozen-lockfile --filter @t3tools/scripts...

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: fd-desktop-*
          merge-multiple: true
          path: release-assets

      - name: Merge updater manifests
        shell: bash
        run: |
          set -euo pipefail
          node scripts/merge-update-manifests.ts --platform mac \
            release-assets/latest-mac.yml \
            release-assets/latest-mac-x64.yml
          node scripts/merge-update-manifests.ts --platform win \
            release-assets/latest-win-arm64.yml \
            release-assets/latest-win-x64.yml \
            release-assets/latest.yml
          rm release-assets/latest-mac-x64.yml \
            release-assets/latest-win-arm64.yml \
            release-assets/latest-win-x64.yml

      - name: Finalize updater manifests from release assets
        shell: bash
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          node scripts/finalize-update-manifest.ts release-assets/latest-mac.yml "$VERSION" \
            "FD-Enterprise-AI-$VERSION-mac-arm64.zip" \
            "FD-Enterprise-AI-$VERSION-mac-arm64.dmg" \
            "FD-Enterprise-AI-$VERSION-mac-x64.zip" \
            "FD-Enterprise-AI-$VERSION-mac-x64.dmg"
          node scripts/finalize-update-manifest.ts release-assets/latest.yml "$VERSION" \
            "FD-Enterprise-AI-$VERSION-win-arm64.exe" \
            "FD-Enterprise-AI-$VERSION-win-arm64.exe.blockmap" \
            "FD-Enterprise-AI-$VERSION-win-x64.exe" \
            "FD-Enterprise-AI-$VERSION-win-x64.exe.blockmap"

      - name: Verify exact production bundle
        shell: bash
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          node scripts/verify-desktop-release-bundle.ts release-assets "$VERSION"
          (cd release-assets && sha256sum * > ../SHA256SUMS)
          mv SHA256SUMS release-assets/SHA256SUMS

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fd-desktop-release-${{ needs.preflight.outputs.version }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14
